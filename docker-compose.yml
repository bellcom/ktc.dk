version: "3"
services:
  nginx:
    image: nginx:1.14.0
    ports:
    - "8000:80"
    volumes:
    - ./:/var/www/html:cached
    - ./docker/conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - web
  php:
    image: php:5.6-fpm
    build:
      context: ./docker/builds/php
    volumes:
      - ./:/var/www/html:cached
      - ./docker/conf/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/scripts/drush.phar:/usr/local/bin/drush
    networks:
      - web
  mysql:
    image: mysql:5.7
    ports:
      - "3306:3306"
    volumes:
      - ./docker/conf/mysql/my.cnf:/etc/mysql/my.cnf
      - ./docker/data/db:/var/lib/mysql
      - ./docker/data/db-init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: drop
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: drop
      MYSQL_PASSWORD: drop
    networks:
      - web
  elasticsearch:
    image: yeasy/elasticsearch:1.7
    ports:
      - "9200:9200"
    environment:
      - cluster.name=ktc_elasticsearch
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - web
  mailhog:
    image: mailhog/mailhog
    hostname: mailhog
    ports:
      - "8025:8025"
      - "1025"
    networks:
      - web
networks:
  web:
    driver: bridge